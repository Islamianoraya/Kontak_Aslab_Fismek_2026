        // Fungsi Render Card
        function renderCards(list) {
            const container = document.getElementById('aslabList');
            const counter = document.getElementById('totalCounter');

            container.innerHTML = '';
            counter.innerText = `Menampilkan ${list.length} dari ${dataAslab.length} kontak`;

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-8 text-sm">Tidak ada kontak yang ditemukan</div>`;
                return;
            }

            list.forEach(aslab => {
                const hasNumber = aslab.nomor && aslab.nomor !== '-';
                const actionButton = hasNumber
                    ? `<a href="https://wa.me/${aslab.nomor}" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white font-semibold px-4 py-2 rounded-xl text-xs sm:text-sm shadow-sm transition-colors flex items-center gap-1.5">Chat</a>`
                    : `<span class="bg-slate-200 text-slate-400 font-semibold px-4 py-2 rounded-xl text-xs sm:text-sm cursor-not-allowed">Tidak Ada No</span>`;

                const isCoordinator = aslab.jabatan === "Koordinator";
                const badge = isCoordinator
                    ? `<span class="ml-2 inline-block bg-accent-yellow text-navy-dark text-[10px] font-bold px-2 py-0.5 rounded-full align-middle">KOORDINATOR</span>`
                    : '';

                const card = document.createElement('div');
                card.className = `aslab-card rounded-xl p-4 flex justify-between items-center border transition-all ${
                    isCoordinator
                        ? 'bg-amber-50 hover:bg-amber-100/80 border-accent-yellow/60'
                        : 'bg-slate-50 hover:bg-slate-100/80 border-slate-200/60'
                }`;
                card.innerHTML = `
                    <div class="pr-2">
                        <div class="font-bold text-slate-900 nama">${aslab.nama}${badge}</div>
                        <div class="text-xs text-slate-500 font-medium mt-0.5 nomor">${hasNumber ? '+' + aslab.nomor : 'Tanpa Kontak'}</div>
                    </div>
                    ${actionButton}
                `;
                container.appendChild(card);
            });
        }

        // Fungsi Filter Pencarian
        function filterAslab() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = dataAslab.filter(item =>
                item.nama.toLowerCase().includes(query) ||
                item.nomor.includes(query)
            );
            renderCards(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderCards(dataAslab);
